<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>flask sample app</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>サンプルトップ</h1>
        <h2>一覧</h2>
            {% if samples == [] %}
                <p>まだ情報がありません</p>
            {% else %}
                <table border="1">
                    <tr>
                        <th>タイトル</th>
                        <th>ナンバー</th>
                        <th>登録日</th>
                    </tr>
                    {% for sample in samples %}
                        <tr>
                            <td>{{ sample.title }}</td>
                            <td>{{ sample.number }}番</td>
                            <td>{{ sample.create_day }}</td>
                        </tr>
                    {% endfor %}
                </table>
            {% endif %}
        <a href="{{ url_for('form_html') }}">編集</a>
    </body>
</html>
