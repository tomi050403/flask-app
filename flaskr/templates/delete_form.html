<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>flask sample app</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>Do you really want to delete it?</h1>
        <p>Deletion Target：</p>
        <table border="1">
            <tr>
                <th>タイトル</th>
                <th>ナンバー</th>
                <th>登録日</th>
            </tr>
            <tr>
                <td>{{ sample.title }}</td>
                <td>{{ sample.number }}</td>
                <td>{{ sample.create_day }}</td>
            </tr>
        </table>
        <form action="{{ url_for('delete_form', sample_id=sample.id) }}" method="post">
            <button type="submit" name="form" value="true">Delete</button>
            <button type="submit" name="cancel" value="true">Cancel</button>
        </form>
    </body>
</html>
